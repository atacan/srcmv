[package]
name = "srcmv-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line application for srcmv"

[[bin]]
name = "srcmv"
path = "src/main.rs"

[dependencies]
srcmv-core = { path = "../srcmv-core" }
srcmv-fs = { path = "../srcmv-fs" }
srcmv-lsp = { path = "../srcmv-lsp" }
srcmv-protocol = { path = "../srcmv-protocol" }
clap.workspace = true
gen-lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true

[dev-dependencies]
srcmv-test-support = { path = "../srcmv-test-support" }
proptest = "1.7.0"
tempfile = "3.23.0"

[[test]]
name = "select_cli"
path = "tests/select_cli.rs"
harness = false

[[test]]
name = "outline_cli"
path = "tests/outline_cli.rs"
harness = false

[lints]
workspace = true
