[workspace]
members = [
    "crates/srcmv-cli",
    "crates/srcmv-core",
    "crates/srcmv-fs",
    "crates/srcmv-lsp",
    "crates/srcmv-protocol",
    "crates/srcmv-test-support",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/atacan/srcmv"

[workspace.dependencies]
clap = { version = "4.5.46", features = ["derive"] }
crossbeam-channel = "=0.5.16"
directories = "=6.0.0"
gen-lsp-types = { version = "=0.11.0", features = ["url"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
getrandom = "0.3.4"
jsonschema = { version = "=0.49.9", default-features = false }
rustix = { version = "1.1.4", features = ["fs", "process"] }
toml = "=1.1.4"
url = { version = "=2.5.8", features = ["serde"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
