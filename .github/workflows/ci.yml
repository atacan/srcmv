name: CI

# Only run when files that can change the build/test outcome change.
# When introducing new impactful paths (fixtures, schemas, CI-run scripts),
# extend both path lists below.
on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/schema/**'
      - '.github/workflows/ci.yml'
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'tests/**'
      - 'examples/**'
      - 'scripts/**'
      - 'docs/schema/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            architecture: x86_64
          - name: macOS arm64
            os: macos-15
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Check workspace metadata
        run: cargo metadata --no-deps
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Phase 9 platform qualification
        run: scripts/qualify-platform.sh
      - name: Check user-facing examples
        run: scripts/check-examples.sh
      - name: Check canonical schema URLs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/check-schema-urls.sh
      - name: Build
        run: cargo build --workspace --all-features
