name: Repository Context

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  context:
    name: Update repository context report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: atacan/repository-context-action@bfcf64d671fef827a70bb14693ffb0d26d9ce541 # v1
