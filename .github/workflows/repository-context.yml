name: Repository Context

on:
  # Run once per pull request, only after it merges, rather than after
  # every pushed commit. No path filter on purpose: cloc and tiktoken
  # count every tracked file, so any change can move the numbers.
  pull_request:
    types:
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: repository-context-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  context:
    name: Report repository context size
    # Closed-but-unmerged pull requests produce no report.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge ref of a closed pull request can be garbage-collected;
          # check out main so the report describes the repository exactly as
          # the merge landed it.
          ref: main
      - id: context
        uses: atacan/repository-context-action@bfcf64d671fef827a70bb14693ffb0d26d9ce541 # v1
        with:
          # The report is published as a comment; nothing is committed to
          # the repository, so main's rules are never involved.
          commit: "false"
      - name: Publish the report as a pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: REPOSITORY_CONTEXT_SIZE.md
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- repository-context-report -->'
          body_file="$(mktemp)"
          {
            printf '%s\n\n' "$marker"
            cat "$REPORT"
          } >"$body_file"

          # Replace this PR's previous report comment instead of stacking
          # a new one on every push. The marker contains no characters that
          # need jq escaping, so it is interpolated directly into the filter
          # (gh api has no --arg passthrough for its embedded jq).
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "(.[] | select(.body | startswith(\"${marker}\")) | .id)" \
            | head -n1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$(cat "$body_file")" >/dev/null
            echo "Updated report comment ${comment_id}"
          else
            gh pr comment "$PR_NUMBER" --body-file "$body_file"
          fi
