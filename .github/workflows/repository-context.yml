name: Repository Context

on:
  # No path filter: cloc and tiktoken count every tracked file, so any
  # pull request can move the report. Runs are cheap.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One live report per pull request; newer pushes supersede older runs.
  group: repository-context-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  context:
    name: Report repository context size
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: context
        uses: atacan/repository-context-action@bfcf64d671fef827a70bb14693ffb0d26d9ce541 # v1
        with:
          # The report is published as a comment; nothing is committed to
          # the repository, so main's rules are never involved.
          commit: "false"
      - name: Publish the report as a pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: REPOSITORY_CONTEXT_SIZE.md
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- repository-context-report -->'
          body_file="$(mktemp)"
          {
            printf '%s\n\n' "$marker"
            cat "$REPORT"
          } >"$body_file"

          # Replace this PR's previous report comment instead of stacking
          # a new one on every push.
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '([.[] | select(.body | startswith($m))][0].id) // empty' --arg m "$marker")"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$(cat "$body_file")" >/dev/null
            echo "Updated report comment ${comment_id}"
          else
            gh pr comment "$PR_NUMBER" --body-file "$body_file"
          fi
